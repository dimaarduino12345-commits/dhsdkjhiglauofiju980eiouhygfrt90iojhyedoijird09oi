<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TONE Wallet — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --button: var(--tg-theme-button-color, #3390ec);
      --accent: #33b8ec;
      --green: #34c759;
      --red: #ff3b30;
      --app-height: 100vh;
    }

    html {
      background-color: var(--bg);
      -webkit-text-size-adjust: 100%;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      /* СДВИГ: сверху 80px, снизу 100px + безопасная зона */
      padding: 80px 16px calc(100px + env(safe-area-inset-bottom, 0px)) 16px;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      min-height: var(--app-height);
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    /* Профиль */
    .profile-card {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; background: var(--secondary-bg);
      border-radius: 16px; margin-bottom: 16px;
      width: 100%; min-width: 0;
    }
    .avatar-wrapper {
      width: 56px; height: 56px; border-radius: 50%;
      overflow: hidden; background: var(--button);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .avatar-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-initials { color: #fff; font-size: 22px; font-weight: 600; }
    .user-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .full-name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .username { font-size: 13px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Баланс */
    .balance-card {
      display: flex; align-items: center; gap: 14px;
      padding: 20px; background: var(--secondary-bg);
      border-radius: 16px; margin-bottom: 16px;
      width: 100%; min-width: 0;
    }
    .tone-img {
      width: 56px; height: 56px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(51, 184, 236, 0.3);
    }
    .balance-info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .balance-amount { 
      font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; 
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
      font-variant-numeric: tabular-nums;
    }
    .balance-label { font-size: 12px; color: var(--hint); font-weight: 500; margin-top: 4px; letter-spacing: 1px; }

    /* Кнопки */
    .actions-row { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; }
    .btn {
      flex: 1; min-width: 0;
      border: none; border-radius: 14px;
      padding: 15px 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s; font-family: inherit;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary {
      background: var(--accent); color: #fff;
      box-shadow: 0 4px 14px rgba(51, 184, 236, 0.35);
    }
    .btn-secondary {
      background: var(--secondary-bg); color: var(--text);
      border: 1.5px solid rgba(51, 184, 236, 0.4);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Панели */
    .panel {
      background: var(--secondary-bg); border-radius: 16px;
      padding: 16px; margin-bottom: 20px; display: none;
      width: 100%; min-width: 0;
    }
    .panel.active { display: block; animation: slideDown 0.25s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .panel-title {
      font-size: 14px; font-weight: 600; color: var(--hint);
      margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; justify-content: space-between; align-items: center;
      min-width: 0; gap: 8px;
    }
    .panel-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-title .count {
      background: rgba(51, 184, 236, 0.15); color: var(--accent);
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px;
      flex-shrink: 0;
    }
    .input-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg); border-radius: 14px; padding: 10px 14px;
      margin-bottom: 14px; width: 100%; min-width: 0;
    }
    .input-row .tone-img { width: 40px; height: 40px; box-shadow: none; }
    .input-row input {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 24px; font-weight: 700; color: var(--text);
      font-family: inherit; min-width: 0; width: 100%;
    }
    .input-row input::placeholder { color: var(--hint); font-weight: 400; }
    .field-label { font-size: 12px; color: var(--hint); margin-bottom: 6px; font-weight: 500; }
    .panel .btn { width: 100%; margin-top: 4px; }

    /* Поиск и список контактов */
    .search-input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid transparent; background: var(--bg);
      color: var(--text); font-size: 14px; font-family: inherit;
      outline: none; margin-bottom: 12px; min-width: 0;
    }
    .search-input:focus { border-color: var(--accent); }

    .contact-list {
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 14px; max-height: 280px; overflow-y: auto;
      width: 100%; min-width: 0;
    }
    .contact-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px; background: var(--bg);
      border-radius: 12px; cursor: pointer;
      border: 1.5px solid transparent;
      transition: border-color 0.2s, background 0.2s;
      width: 100%; min-width: 0;
    }
    .contact-item:active { background: var(--secondary-bg); }
    .contact-item.selected { border-color: var(--accent); background: rgba(51, 184, 236, 0.08); }
    .contact-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--button); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; flex-shrink: 0;
      overflow: hidden;
    }
    .contact-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .contact-info { min-width: 0; flex: 1; }
    .contact-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-username { font-size: 12px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* История операций */
    .operations-title {
      font-size: 14px; font-weight: 600; color: var(--hint);
      margin: 12px 0 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .op-list { display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0; }
    .op-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--secondary-bg); border-radius: 12px;
      width: 100%; min-width: 0;
    }
    .op-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; flex-shrink: 0;
    }
    .op-icon.in { background: rgba(52, 199, 89, 0.15); color: var(--green); }
    .op-icon.out { background: rgba(255, 59, 48, 0.15); color: var(--red); }
    .op-info { flex: 1; min-width: 0; }
    .op-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .op-time { font-size: 12px; color: var(--hint); margin-top: 2px; }
    .op-amount { font-size: 15px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .op-amount.in { color: var(--green); }
    .op-amount.out { color: var(--red); }
    .empty-state { text-align: center; padding: 24px; color: var(--hint); font-size: 14px; line-height: 1.5; }

    /* Уведомления */
    .toast {
      position: fixed; bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%) translateY(120%);
      background: rgba(0, 0, 0, 0.85); color: #fff;
      padding: 14px 20px; border-radius: 12px;
      font-size: 14px; font-weight: 500;
      transition: transform 0.3s ease; z-index: 10000;
      max-width: 90%; text-align: center;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: rgba(52, 199, 89, 0.95); }
    .toast.error { background: rgba(255, 59, 48, 0.95); }
  </style>
</head>
<body>

  <div class="profile-card">
    <div class="avatar-wrapper" id="avatarWrapper">
      <span class="avatar-initials" id="avatarInitials">?</span>
    </div>
    <div class="user-info">
      <div class="full-name" id="fullName">Загрузка...</div>
      <div class="username" id="username"></div>
    </div>
  </div>

  <div class="balance-card">
    <img class="tone-img" src="https://fs.oblakoteka.ru/d.fotovssylku.ru/2026/10/27/image42474d89238e13c03.png" alt="TONE" />
    <div class="balance-info">
      <div class="balance-amount" id="balanceAmount">0</div>
      <div class="balance-label">TONE</div>
    </div>
  </div>

  <div class="actions-row">
    <button class="btn btn-primary" id="btnTopup" disabled>Пополнить</button>
    <button class="btn btn-secondary" id="btnTransfer" disabled>Перевести</button>
  </div>

  <div class="panel" id="topupPanel">
    <div class="panel-title">Пополнение баланса</div>
    <div class="input-row">
      <img class="tone-img" src="https://fs.oblakoteka.ru/d.fotovssylku.ru/2026/10/27/image42474d89238e13c03.png" alt="TONE" />
      <input type="number" inputmode="numeric" id="topupInput" placeholder="0" min="1" step="1" />
    </div>
    <button class="btn btn-primary" id="btnTopupConfirm">Пополнить</button>
  </div>

  <div class="panel" id="transferPanel">
    <div class="panel-title">
      <span>Перевод TONE</span>
      <span class="count" id="userCount">0</span>
    </div>

    <input type="text" class="search-input" id="searchInput" placeholder="Поиск по имени" />

    <div class="field-label">Выберите получателя</div>
    <div class="contact-list" id="contactList">
      <div class="empty-state">Загрузка...</div>
    </div>

    <div class="field-label">Сумма</div>
    <div class="input-row">
      <img class="tone-img" src="https://fs.oblakoteka.ru/d.fotovssylku.ru/2026/10/27/image42474d89238e13c03.png" alt="TONE" />
      <input type="number" inputmode="numeric" id="transferInput" placeholder="0" min="1" step="1" />
    </div>

    <button class="btn btn-primary" id="btnTransferConfirm">Отправить</button>
  </div>

  <div class="operations-title">Операции с TONE</div>
  <div class="op-list" id="opList">
    <div class="empty-state">Пока нет операций</div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase, ref, onValue, get, update, push, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    /* ========== Firebase ========== */
    const firebaseConfig = {
      apiKey: "AIzaSyAwmjZwlgXmhqeFtiwDDN3Qv2C53MStWkw",
      authDomain: "tonewallet-dd99b.firebaseapp.com",
      databaseURL: "https://tonewallet-dd99b-default-rtdb.firebaseio.com",
      projectId: "tonewallet-dd99b",
      storageBucket: "tonewallet-dd99b.firebasestorage.app",
      messagingSenderId: "559491672168",
      appId: "1:559491672168:web:b489dc7d275ca4774933dd"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    /* ========== Переменные ========== */
    let tgUser = null;
    let userId = null;
    let currentUser = null;
    let allUsers = {};
    let selectedRecipientId = null;
    let searchQuery = '';

    const balanceAmountEl = document.getElementById('balanceAmount');
    const contactListEl = document.getElementById('contactList');
    const opListEl = document.getElementById('opList');
    const userCountEl = document.getElementById('userCount');
    const searchInput = document.getElementById('searchInput');
    const btnTopup = document.getElementById('btnTopup');
    const btnTransfer = document.getElementById('btnTransfer');
    const topupPanel = document.getElementById('topupPanel');
    const transferPanel = document.getElementById('transferPanel');

    /* ========== Утилиты ========== */
    function showToast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + (type === 'success' ? 'success' : type === 'error' ? 'error' : '');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2500);
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function displayName(u) {
      if (!u) return '';
      const name = `${u.firstName || ''} ${u.lastName || ''}`.trim();
      if (name) return name;
      if (u.username) return '@' + u.username;
      return u.id || 'Пользователь';
    }
    function initialsOf(u) {
      const fn = (u?.firstName || '')[0] || '';
      const ln = (u?.lastName || '')[0] || '';
      return (fn + ln).toUpperCase() || (u?.username?.[0] || '?').toUpperCase();
    }
    function nowStr(ts) {
      const d = new Date(ts);
      return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    /* ========== Telegram ========== */
    function getTgUser() {
      return window.Telegram?.WebApp?.initDataUnsafe?.user || null;
    }

    function updateUserState() {
      const u = getTgUser();
      if (u) {
        tgUser = u;
        userId = String(u.id);
        currentUser = {
          id: userId,
          firstName: u.first_name || '',
          lastName: u.last_name || '',
          username: u.username || '',
          photoUrl: u.photo_url || ''
        };
      } else {
        let devId = localStorage.getItem('dev_id');
        if (!devId) {
          devId = 'dev_' + Math.random().toString(36).slice(2, 8);
          localStorage.setItem('dev_id', devId);
        }
        userId = devId;
        currentUser = { id: userId, firstName: 'Dev', lastName: 'User', username: 'dev', photoUrl: '' };
        tgUser = null;
      }
    }

    async function waitForTgUser(timeoutMs = 3000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        const u = getTgUser();
        if (u && u.id) return u;
        await new Promise(r => setTimeout(r, 100));
      }
      return null;
    }

    /* ========== Высота вьюпорта ========== */
    function setAppHeight() {
      const tg = window.Telegram?.WebApp;
      if (tg && tg.viewportStableHeight) {
        document.documentElement.style.setProperty('--app-height', tg.viewportStableHeight + 'px');
      } else {
        document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
      }
    }

    /* ========== Firebase синхронизация ========== */
    async function syncTelegramProfile() {
      if (!tgUser || !userId) return;
      const userRef = ref(db, `users/${userId}`);
      const snap = await get(userRef);
      const fresh = {
        firstName: currentUser.firstName,
        lastName: currentUser.lastName,
        username: currentUser.username,
        photoUrl: currentUser.photoUrl,
        updatedAt: Date.now()
      };
      if (!snap.exists()) {
        fresh.balance = 0;
        fresh.createdAt = Date.now();
      }
      await update(userRef, fresh);
    }

    let lastSync = 0;
    function scheduleSync(force = false) {
      const now = Date.now();
      if (!force && now - lastSync < 30000) return;
      lastSync = now;
      syncTelegramProfile().catch(err => console.warn('sync failed', err));
    }

    async function cleanupLegacyDemos() {
      const snap = await get(ref(db, 'users'));
      const users = snap.val() || {};
      const updates = {};
      for (const id of Object.keys(users)) {
        if (id.startsWith('demo_')) {
          updates[`users/${id}`] = null;
          updates[`transactions/${id}`] = null;
        }
      }
      const metaSnap = await get(ref(db, 'meta/seeded'));
      if (metaSnap.exists()) updates['meta/seeded'] = null;
      if (Object.keys(updates).length) await update(ref(db), updates);
    }

    /* ========== Отрисовка ========== */
    function renderProfile() {
      const fullNameEl = document.getElementById('fullName');
      const usernameEl = document.getElementById('username');
      const avatarWrapper = document.getElementById('avatarWrapper');

      const firebaseMe = allUsers[userId] || {};
      const me = tgUser
        ? {
            firstName: currentUser.firstName || firebaseMe.firstName || '',
            lastName: currentUser.lastName || firebaseMe.lastName || '',
            username: currentUser.username || firebaseMe.username || '',
            photoUrl: currentUser.photoUrl || firebaseMe.photoUrl || ''
          }
        : { ...firebaseMe, ...currentUser };

      const fullName = `${me.firstName || ''} ${me.lastName || ''}`.trim() || 'Пользователь';
      fullNameEl.textContent = fullName;
      usernameEl.textContent = me.username ? '@' + me.username : '';

      if (me.photoUrl) {
        const existing = avatarWrapper.querySelector('img');
        if (existing && existing.dataset.src === me.photoUrl) return;
        const img = new Image();
        img.dataset.src = me.photoUrl;
        img.alt = 'Аватар';
        img.onload = () => { avatarWrapper.innerHTML = ''; avatarWrapper.appendChild(img); };
        img.onerror = () => {
          avatarWrapper.innerHTML = `<span class="avatar-initials">${escapeHtml(initialsOf(me))}</span>`;
        };
        img.src = me.photoUrl;
      } else {
        avatarWrapper.innerHTML = `<span class="avatar-initials">${escapeHtml(initialsOf(me))}</span>`;
      }
    }

    function renderBalance() {
      const me = allUsers[userId];
      const bal = typeof me?.balance === 'number' ? me.balance : 0;
      balanceAmountEl.textContent = bal.toLocaleString('ru-RU');
    }

    function getRealUsers() {
      return Object.entries(allUsers)
        .filter(([id, u]) => id !== userId && u && u.createdAt)
        .filter(([id]) => !id.startsWith('demo_'))
        .map(([id, u]) => ({ id, ...u }));
    }

    function renderContactList() {
      const all = getRealUsers();
      userCountEl.textContent = String(all.length);

      if (!all.length) {
        contactListEl.innerHTML = `
          <div class="empty-state">
            Пока никто не пользовался приложением, кроме вас.<br>
            Поделитесь Mini App с друзьями.
          </div>`;
        return;
      }

      const q = searchQuery.trim().toLowerCase();
      const filtered = q
        ? all.filter(u => {
            const name = displayName(u).toLowerCase();
            const un = (u.username || '').toLowerCase();
            const id = u.id.toLowerCase();
            return name.includes(q) || un.includes(q) || id.includes(q);
          })
        : all;

      filtered.sort((a, b) => displayName(a).localeCompare(displayName(b)));

      if (!filtered.length) {
        contactListEl.innerHTML = `<div class="empty-state">Никого не найдено</div>`;
        return;
      }

      contactListEl.innerHTML = filtered.map(u => {
        const selected = selectedRecipientId === u.id ? ' selected' : '';
        const avatarContent = u.photoUrl
          ? `<img src="${escapeHtml(u.photoUrl)}" alt="" onerror="this.style.display='none';this.parentNode.textContent='${escapeHtml(initialsOf(u))}'">`
          : escapeHtml(initialsOf(u));
        return `
          <div class="contact-item${selected}" data-id="${escapeHtml(u.id)}">
            <div class="contact-avatar">${avatarContent}</div>
            <div class="contact-info">
              <div class="contact-name">${escapeHtml(displayName(u))}</div>
              ${u.username ? `<div class="contact-username">@${escapeHtml(u.username)}</div>` : `<div class="contact-username">ID ${escapeHtml(u.id)}</div>`}
            </div>
          </div>`;
      }).join('');
    }

    function renderOperations(list) {
      if (!list || !list.length) {
        opListEl.innerHTML = '<div class="empty-state">Пока нет операций</div>';
        return;
      }
      opListEl.innerHTML = list.slice(0, 50).map(tx => {
        const isIn = tx.type === 'in';
        const cls = isIn ? 'in' : 'out';
        const sign = isIn ? '+' : '-';
        return `
          <div class="op-item">
            <div class="op-icon ${cls}">${sign}</div>
            <div class="op-info">
              <div class="op-title">${escapeHtml(tx.title || (isIn ? 'Пополнение' : 'Перевод'))}</div>
              <div class="op-time">${nowStr(tx.ts || Date.now())}</div>
            </div>
            <div class="op-amount ${cls}">${sign}${(tx.amount || 0).toLocaleString('ru-RU')}</div>
          </div>`;
      }).join('');
    }

    /* ========== Слушатели БД ========== */
    function listenUsers() {
      onValue(ref(db, 'users'), (snap) => {
        allUsers = snap.val() || {};
        renderProfile();
        renderBalance();
        renderContactList();
        btnTopup.disabled = false;
        btnTransfer.disabled = false;
      });
    }

    function listenTransactions() {
      onValue(ref(db, `transactions/${userId}`), (snap) => {
        const val = snap.val() || {};
        const list = Object.entries(val)
          .map(([id, v]) => ({ id, ...v }))
          .sort((a, b) => (b.ts || 0) - (a.ts || 0));
        renderOperations(list);
      });
    }

    /* ========== UI обработчики ========== */
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderContactList();
    });

    contactListEl.addEventListener('click', (e) => {
      const item = e.target.closest('.contact-item');
      if (!item) return;
      selectedRecipientId = item.dataset.id;
      document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
    });

    btnTopup.addEventListener('click', () => {
      topupPanel.classList.toggle('active');
      if (topupPanel.classList.contains('active')) transferPanel.classList.remove('active');
    });

    btnTransfer.addEventListener('click', () => {
      transferPanel.classList.toggle('active');
      if (transferPanel.classList.contains('active')) topupPanel.classList.remove('active');
    });

    document.getElementById('btnTopupConfirm').addEventListener('click', async (e) => {
      const input = document.getElementById('topupInput');
      const amount = Math.floor(Number(input.value));
      if (!amount || amount <= 0) { showToast('Введите сумму', 'error'); return; }

      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        await runTransaction(ref(db, `users/${userId}/balance`), (cur) => (cur || 0) + amount);
        await push(ref(db, `transactions/${userId}`), {
          type: 'in', amount, title: 'Пополнение', ts: Date.now()
        });
        input.value = '';
        topupPanel.classList.remove('active');
        showToast(`+${amount} TONE зачислено`, 'success');
      } catch (err) {
        console.error(err);
        showToast('Ошибка пополнения', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('btnTransferConfirm').addEventListener('click', async (e) => {
      const input = document.getElementById('transferInput');
      const amount = Math.floor(Number(input.value));

      if (!selectedRecipientId) { showToast('Выберите получателя', 'error'); return; }
      if (!amount || amount <= 0) { showToast('Введите сумму', 'error'); return; }
      if (selectedRecipientId === userId) { showToast('Нельзя перевести себе', 'error'); return; }

      const recipient = allUsers[selectedRecipientId];
      if (!recipient || !recipient.createdAt) { showToast('Получатель не найден', 'error'); return; }

      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        const res = await runTransaction(ref(db, `users/${userId}/balance`), (cur) => {
          if ((cur || 0) < amount) return;
          return cur - amount;
        });
        if (!res.committed) { showToast('Недостаточно средств', 'error'); return; }

        await runTransaction(ref(db, `users/${selectedRecipientId}/balance`), (cur) => (cur || 0) + amount);

        const senderName = displayName(allUsers[userId] || currentUser);
        const recipientName = displayName(recipient);
        const ts = Date.now();
        const senderTxRef = push(ref(db, `transactions/${userId}`));
        const recipientTxRef = push(ref(db, `transactions/${selectedRecipientId}`));

        await update(ref(db), {
          [`transactions/${userId}/${senderTxRef.key}`]: {
            type: 'out', amount, title: `Перевод: ${recipientName}`,
            to: selectedRecipientId, ts
          },
          [`transactions/${selectedRecipientId}/${recipientTxRef.key}`]: {
            type: 'in', amount, title: `Перевод от: ${senderName}`,
            from: userId, ts
          }
        });

        input.value = '';
        selectedRecipientId = null;
        searchQuery = '';
        searchInput.value = '';
        document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('selected'));
        transferPanel.classList.remove('active');
        showToast(`Переведено ${amount} TONE`, 'success');
      } catch (err) {
        console.error(err);
        showToast('Ошибка перевода', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    /* ========== Инициализация ========== */
    (async function init() {
      setAppHeight();
      window.addEventListener('resize', setAppHeight);

      if (!window.Telegram?.WebApp) {
        updateUserState();
        renderProfile();
        showToast('Открыто вне Telegram', 'error');
        return;
      }

      const tg = window.Telegram.WebApp;

      try {
        tg.ready();
        tg.expand();

        if (typeof tg.disableVerticalSwipes === "function") {
          try { tg.disableVerticalSwipes(); } catch (e) {}
        }

        if (tg.onEvent) {
          tg.onEvent('viewportChanged', setAppHeight);
        }

        if (tg.themeParams) {
          document.body.style.backgroundColor = tg.themeParams.bg_color || '#ffffff';
          document.body.style.color = tg.themeParams.text_color || '#000000';
        }
        if (tg.onEvent) {
          tg.onEvent('themeChanged', () => {
            if (tg.themeParams) {
              document.body.style.backgroundColor = tg.themeParams.bg_color || '#ffffff';
              document.body.style.color = tg.themeParams.text_color || '#000000';
            }
          });
        }

        await waitForTgUser();
        updateUserState();
        renderProfile();
        setAppHeight();

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            updateUserState();
            scheduleSync(true);
            setAppHeight();
          }
        });

        await cleanupLegacyDemos();
        await syncTelegramProfile();
        lastSync = Date.now();
        listenUsers();
        listenTransactions();

      } catch (err) {
        console.error('Init error:', err);
        showToast('Ошибка инициализации', 'error');
      }
    })();
  </script>
</body>
</html>
